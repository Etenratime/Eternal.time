<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناظر تعادل</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 30px;
            border: 1px solid #333;
            border-radius: 12px;
            background-color: #111;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.1);
        }
        h1 {
            color: #ff3333;
            font-size: 26px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>سنجش تعادل کیهانی</h1>
        <p>این صفحه به صورت مستقل و رایگان روی گیت‌هاب میزبانی شده است.</p>
        <p>ملاک، عملکرد و تعادل است.</p>
    </div>
</body>
</html>
